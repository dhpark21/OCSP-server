[package]
name = "ocsp-server"
authors = ["DorianCoding <108593662+DorianCoding@users.noreply.github.com>"]
description = "OCSP server, listening for requests to give responses."
version = "0.7.4"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
repository = "https://github.com/DorianCoding/OCSP_server"
keywords = ["ocsp", "server", "ocsp-response"]
categories = ["caching", "cryptography"]
exclude = [
    "binaries/*",
    "config.toml",
    "service.sh",
]

[dependencies]
clap = { version = "4.6.6", features = ["derive", "cargo"] }
chrono = { version = "~0.4.45", default-features = false, features = ["std", "serde"] }
config-file = "~0.2.3"
serde = "~1.0.229"
diesel = { version = "2.3.12", features = ["r2d2", "chrono"] }
r2d2 = "0.8.10"
ocsp = {git = "https://github.com/DorianCoding/ocsp-rs.git", tag="1.0.0" }
pem = "4.0.0"
openssl = { version = "0.10.81", features = ["vendored"] }
ring = "0.17.14"
x509-parser = "~0.18.1"
hex = "~0.4.3"
zeroize = { version = "~1.9.0", features = ["std", "zeroize_derive"] }
log = "0.4.33"
async-trait = "0.1.92"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }

[dependencies.rocket]
version = "0.5.1"
features = ["json"]

[dev-dependencies]
mockall = "0.15.0"

[features]
api = []
sqlite = ["diesel/sqlite"]
mysql = ["diesel/mysql"]
postgres = ["diesel/postgres"]
default = ["api", "mysql", "postgres", "sqlite"]

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
opt-level = 3

[lints.rust]
unsafe_code = "deny"
unused_imports = "deny"

[badges]
maintenance = {status = "passively-maintained" }
